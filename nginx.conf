worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # TASK D: Configure the Edge Reverse Proxy and Load Balancer
    # This block defines your two backends so Nginx can round-robin between them
    upstream backend_servers {
        server 10.7.5.187:3001;  # Mac 3 (Backend A)
        server 10.7.15.184:3002;  # Mac 4 (Backend B)
    }

    server {
        # Listen on port 80 (and 8080 as a fallback)
        listen 80;
        listen 8080;
        
        # This is the domain you will set up in DNS later
        server_name app.teamX.test api.teamX.test;

        location / {
            # Route all traffic to the upstream block defined above
            proxy_pass http://backend_servers;
            
            # Pass original request headers to the backends
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
