# Mac 1 (DNS server) - Task B.  Path: /opt/homebrew/etc/dnsmasq.conf
# Serve DNS on the LAN interface (Mac 1 = 10.7.13.235)
listen-address=10.7.13.235,127.0.0.1
bind-interfaces

# Private zone only: never forward .test names to the internet
local=/team1.test/
domain-needed
bogus-priv

# Both names point at the EDGE (Mac 2 / nginx), never at a backend
address=/app.team1.test/10.7.17.39
address=/api.team1.test/10.7.17.39

# TTL handed to clients for these records (raise/lower for Phase 2 Extension B)
local-ttl=30

# Log every query (handy evidence): sudo tail -f /opt/homebrew/var/log/dnsmasq.log
log-queries
log-facility=/opt/homebrew/var/log/dnsmasq.log
